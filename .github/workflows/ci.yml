name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OCaml tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build @shared-platform-check

      - name: Test
        run: opam exec -- dune runtest

      - name: Check shared architecture
        run: scripts/test-shared-ocaml-architecture.sh
