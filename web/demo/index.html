<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCaml Demo React Demo</title>
    <style>
      :root {
        color: #1f2933;
        background: #f6f7f9;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        width: min(520px, calc(100% - 48px));
        margin: 48px auto;
      }

      nav,
      section > div,
      li {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      nav {
        margin-bottom: 24px;
      }

      section {
        padding: 24px;
        border: 1px solid #d8dde5;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 28px rgb(15 23 42 / 8%);
      }

      ul {
        display: grid;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      button,
      input {
        font: inherit;
        min-height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 0 12px;
      }

      input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dist/web/demo/main.js"></script>
  </body>
</html>
