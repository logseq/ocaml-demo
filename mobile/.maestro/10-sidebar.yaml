appId: com.logseq.ocamldemo
---
- launchApp
- assertVisible:
    id: "button.sidebar"
- tapOn:
    id: "button.sidebar"
- assertVisible:
    id: "link.sidebar.tasks"
- assertVisible:
    id: "link.sidebar.journal"
- assertVisible:
    id: "button.sidebar.dismiss"
- tapOn:
    point: 95%, 50%
- assertNotVisible:
    id: "button.sidebar.dismiss"
- assertVisible:
    id: "field.tasks.draft"
- tapOn:
    id: "button.sidebar"
- takeScreenshot: .maestro/screenshots/sidebar-open
- tapOn:
    id: "link.sidebar.journal"
- assertVisible:
    id: "webview.journal"
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "link.sidebar.tasks"
- assertVisible:
    id: "field.tasks.draft"
- swipe:
    start: 15%, 50%
    end: 80%, 50%
    duration: 500
- assertVisible:
    id: "link.sidebar.tasks"
- swipe:
    start: 80%, 50%
    end: 5%, 50%
    duration: 500
- assertNotVisible:
    id: "button.sidebar.dismiss"
- assertVisible:
    id: "field.tasks.draft"
