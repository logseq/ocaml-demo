<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCaml Demo</title>
    <style>
      :root {
        color: #1f2933;
        background: #f6f7f9;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        width: min(520px, calc(100% - 48px));
        margin: 48px auto;
      }

      nav,
      section > div,
      li {
        display: flex;
        gap: 8px;
        align-items: center;
        transition: margin-left 160ms ease;
      }

      nav {
        margin-bottom: 24px;
      }

      section {
        padding: 24px;
        border: 1px solid #d8dde5;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 28px rgb(15 23 42 / 8%);
      }

      ul {
        display: grid;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      button,
      input {
        font: inherit;
        min-height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 0 12px;
      }

      input {
        flex: 1;
      }

      li > span {
        min-width: 12px;
      }

      body.native {
        background: transparent;
      }

      body.native main {
        width: 100%;
        margin: 0;
      }

      body.native main > h1,
      body.native nav {
        display: none;
      }

      body.native section {
        padding: 12px 16px 40px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      body.native section h2 {
        display: none;
      }

      body.native .journals {
        display: grid;
        gap: 10px;
      }

      body.native .journal {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 14px;
        text-align: left;
      }

      body.native .block {
        min-height: 46px;
      }

      .block {
        flex-wrap: wrap;
      }

      .editor-toolbar {
        display: none;
        width: 100%;
        gap: 8px;
        padding-left: 20px;
      }

      .block:focus-within .editor-toolbar {
        display: flex;
      }

      .editor-toolbar button {
        min-width: 40px;
        padding: 0;
      }

      .editor-toolbar svg {
        width: 20px;
        height: 20px;
      }

      body.native .back {
        border: 0;
        padding-left: 0;
        background: transparent;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CQBTSjmF.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.ocamlDemoNativeAvailable = () =>
        Boolean(window.webkit?.messageHandlers?.native);
      window.ocamlDemoPostNative = (messageJSON) =>
        window.webkit.messageHandlers.native.postMessage(JSON.parse(messageJSON));
      window.ocamlDemoSubscribe = (listener) =>
        window.addEventListener("ocamlDemoSnapshot", (event) => listener(event.detail));
      window.ocamlDemoDecodeBase64Utf8 = (encoded) => {
        const bytes = Uint8Array.from(atob(encoded), (character) =>
          character.charCodeAt(0),
        );
        return new TextDecoder().decode(bytes);
      };
      window.ocamlDemoToday = () => {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };
      if (window.ocamlDemoNativeAvailable()) {
        document.body.classList.add("native");
      }
    </script>
  </body>
</html>
